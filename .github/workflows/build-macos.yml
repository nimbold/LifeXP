name: Build macOS ARM64 App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build unsigned macOS ARM64 app
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Confirm runner architecture
        run: |
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller certifi

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Build unsigned app
        run: pyinstaller --noconfirm --clean LifeXP.spec

      - name: Create zip artifact
        run: ditto -c -k --keepParent dist/LifeXP.app LifeXP-macos-arm64-unsigned.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeXP-macos-arm64-unsigned
          path: LifeXP-macos-arm64-unsigned.zip
          if-no-files-found: error

      - name: Attach app to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: LifeXP-macos-arm64-unsigned.zip
